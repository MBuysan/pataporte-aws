AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Pataporte edge (ephemeral): CloudFront in front of the ALB, which serves the
  frontend (nginx on ECS) and routes /api/* to the API.

# NOT DEPLOYED: Learner Lab denies cloudfront:CreateDistribution. Kept as the design for a
# real account; the pipeline publishes the ALB URL instead.

# ponytail: tags are stack-level (see infra/deploy-stack.sh), propagated by CloudFormation.
# ponytail: Learner Lab denies CloudFront OAC and OAI, so the frontend is not served from S3.
# In a real account: private S3 bucket + OAC as the default origin, ALB only for /api/*.

Parameters:
  ProjectName:
    Type: String
    Default: pataporte
    Description: Prefix of the app stack exports

Resources:
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Pataporte
        PriceClass: PriceClass_All
        HttpVersion: http2and3
        Origins:
          # ponytail: CloudFront -> ALB is plain HTTP (no domain/ACM cert in Learner Lab).
          - Id: alb
            DomainName:
              Fn::ImportValue: !Sub ${ProjectName}-AlbDnsName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
        # Static pages: cached at the edge, invalidated on every deploy.
        DefaultCacheBehavior:
          TargetOriginId: alb
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: alb
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # Managed-AllViewerExceptHostHeader

Outputs:
  DistributionId:
    Value: !Ref Distribution
    Export:
      Name: !Sub ${ProjectName}-DistributionId
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
    Export:
      Name: !Sub ${ProjectName}-DistributionDomainName
  Url:
    Value: !Sub https://${Distribution.DomainName}
