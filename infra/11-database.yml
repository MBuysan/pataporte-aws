AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Pataporte database (ephemeral): RDS PostgreSQL 16 in the isolated subnets,
  reachable only from the ECS tasks security group. Multi-AZ.

# ponytail: tags are stack-level (see infra/deploy-stack.sh), propagated by CloudFormation.

Parameters:
  ProjectName:
    Type: String
    Default: pataporte
    Description: Prefix of the network stack exports
  SnapshotIdentifier:
    Type: String
    Default: ''
    Description: >-
      Manual snapshot to restore on create (the deploy workflow picks the newest one of pataporte-db).
      Never change it on an existing stack: a new value replaces the database.

Conditions:
  HasSnapshot: !Not [!Equals [!Ref SnapshotIdentifier, '']]

Resources:
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Pataporte isolated subnets
      SubnetIds:
        - Fn::ImportValue: !Sub ${ProjectName}-IsolatedSubnet1
        - Fn::ImportValue: !Sub ${ProjectName}-IsolatedSubnet2

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Pataporte RDS, 5432 only from the ECS tasks
      VpcId:
        Fn::ImportValue: !Sub ${ProjectName}-VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId:
            Fn::ImportValue: !Sub ${ProjectName}-AppSecurityGroup

  # Ephemeral instance, persistent data: deleting the stack leaves a final manual snapshot
  # (fixed identifier, so deploy can find it and restore it). destroy keeps the 2 newest.
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: pataporte-db
      DBSnapshotIdentifier: !If [HasSnapshot, !Ref SnapshotIdentifier, !Ref AWS::NoValue]
      Engine: postgres
      EngineVersion: '16.10'
      DBInstanceClass: db.t3.micro
      AllocatedStorage: '20'
      StorageType: gp3
      # inherited from the snapshot when restoring (CloudFormation rejects them together)
      StorageEncrypted: !If [HasSnapshot, !Ref AWS::NoValue, true]
      DBName: !If [HasSnapshot, !Ref AWS::NoValue, pataporte]
      MasterUsername: !If [HasSnapshot, !Ref AWS::NoValue, pataporte]
      ManageMasterUserPassword: true
      MultiAZ: true
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref DbSecurityGroup]
      BackupRetentionPeriod: 1
      DeleteAutomatedBackups: true
      DeletionProtection: false

Outputs:
  DbEndpoint:
    Value: !GetAtt Database.Endpoint.Address
    Export:
      Name: !Sub ${ProjectName}-DbEndpoint
  DbPort:
    Value: !GetAtt Database.Endpoint.Port
    Export:
      Name: !Sub ${ProjectName}-DbPort
  DbSecretArn:
    Description: RDS-managed master secret (JSON with username/password)
    Value: !GetAtt Database.MasterUserSecret.SecretArn
    Export:
      Name: !Sub ${ProjectName}-DbSecretArn
  DbName:
    Value: pataporte
    Export:
      Name: !Sub ${ProjectName}-DbName
  DbUser:
    Value: pataporte
    Export:
      Name: !Sub ${ProjectName}-DbUser
