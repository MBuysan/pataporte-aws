AWSTemplateFormatVersion: '2010-09-09'
Description: PATAPORTE private ECS on EC2; optional private assets, outbox dispatcher and edge-only API.
Parameters:
  NetworkStackName:
    Type: String
    Default: pataporte-dev-network
  DataStackName:
    Type: String
    Default: pataporte-dev-data
  BootstrapStackName:
    Type: String
    Default: pataporte-dev-bootstrap
  ImageUri:
    Type: String
    AllowedPattern: '.+@sha256:[a-f0-9]{64}'
    Description: Immutable ECR image digest, never latest
  AlbCertificateArn:
    Type: String
    Default: ''
    Description: ACM certificate for the owned API origin hostname, in this region.
  EnableApiScaling:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
  MigrationImageUri:
    Type: String
    Default: ''
    AllowedPattern: '(^$)|(.+@sha256:[a-f0-9]{64})'
    Description: Stage migrations without rolling API tasks before the schema is ready.
  AsyncStackName:
    Type: String
    Default: pataporte-dev-async
  EnableCloudFeatures:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
  EnableEdgeApi:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
  ApplicationRoleArn:
    Type: String
    Default: ''
    Description: Existing Academy task role; required for S3/SQS. No role is created by this template.
  DispatcherDesiredCount:
    Type: Number
    Default: 0
    AllowedValues: [0, 1]
  DispatcherImageUri:
    Type: String
    Default: ''
    AllowedPattern: '(^$)|(.+@sha256:[a-f0-9]{64})'
    Description: Stage dispatcher code independently while the API still runs its previous release.
  ExecutionRoleArn:
    Type: String
    Default: arn:aws:iam::476855088538:role/LabRole
  InstanceProfileName:
    Type: String
    Default: LabInstanceProfile
  EcsAmi:
    Type: AWS::EC2::Image::Id
    Default: ami-0faa30f5791cd90f7
    Description: Pinned ECS AL2023 image validated in us-east-1; update hosts in a separately reviewed release.
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small]
  ApiDesiredCount:
    Type: Number
    Default: 0
    AllowedValues: [0, 1, 2]
    Description: Keep zero until the one-off migration exits successfully
Conditions:
  HasTls: !Not [!Equals [!Ref AlbCertificateArn, '']]
  ApiScaling: !Equals [!Ref EnableApiScaling, 'true']
  CloudFeatures: !Equals [!Ref EnableCloudFeatures, 'true']
  PlainEdgeApi: !And [!Equals [!Ref EnableEdgeApi, 'true'], !Equals [!Ref AlbCertificateArn, '']]
  SecureEdgeApi: !And [!Equals [!Ref EnableEdgeApi, 'true'], !Not [!Equals [!Ref AlbCertificateArn, '']]]
  HasMigrationImage: !Not [!Equals [!Ref MigrationImageUri, '']]
  HasDispatcherImage: !Not [!Equals [!Ref DispatcherImageUri, '']]
Rules:
  CloudRoleRequired:
    RuleCondition: !Equals [!Ref EnableCloudFeatures, 'true']
    Assertions:
      - Assert: !Not [!Equals [!Ref ApplicationRoleArn, '']]
        AssertDescription: Set an existing application task role when enabling S3 and SQS.
  EdgeRequiresCloud:
    RuleCondition: !Equals [!Ref EnableEdgeApi, 'true']
    Assertions:
      - Assert: !Equals [!Ref EnableCloudFeatures, 'true']
        AssertDescription: Create the async stack and enable cloud features first.
Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: pataporte-dev
      ClusterSettings:
        - Name: containerInsights
          Value: disabled
  HostSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS hosts; no inbound access or SSH
      VpcId:
        Fn::ImportValue: !Sub '${NetworkStackName}-VpcId'
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref EcsAmi
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Name: !Ref InstanceProfileName
        SecurityGroupIds: [!Ref HostSecurityGroup]
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 1
        Monitoring:
          Enabled: false
        CreditSpecification:
          CpuCredits: standard
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 30
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -eu
            cat >> /etc/ecs/ecs.config <<'ECSCONFIG'
            ECS_CLUSTER=${Cluster}
            ECS_ENABLE_TASK_ENI=true
            ECS_AWSVPC_BLOCK_IMDS=true
            ECS_ENABLE_AWSLOGS_EXECUTIONROLE_OVERRIDE=true
            ECSCONFIG
  Hosts:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      MinSize: '2'
      MaxSize: '3'
      DesiredCapacity: '2'
      HealthCheckType: EC2
      HealthCheckGracePeriod: 180
      VPCZoneIdentifier:
        - Fn::ImportValue: !Sub '${NetworkStackName}-AppSubnetAId'
        - Fn::ImportValue: !Sub '${NetworkStackName}-AppSubnetBId'
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      Tags:
        - Key: Name
          Value: pataporte-dev-ecs
          PropagateAtLaunch: true
        - Key: project
          Value: pataporte
          PropagateAtLaunch: true
        - Key: AmazonECSManaged
          Value: 'true'
          PropagateAtLaunch: true
  Capacity:
    Type: AWS::ECS::CapacityProvider
    Properties:
      AutoScalingGroupProvider:
        AutoScalingGroupArn: !Ref Hosts
        ManagedScaling:
          Status: ENABLED
          TargetCapacity: 100
          MinimumScalingStepSize: 1
          MaximumScalingStepSize: 1
          InstanceWarmupPeriod: 120
        ManagedTerminationProtection: DISABLED
        ManagedDraining: ENABLED
  ClusterCapacity:
    Type: AWS::ECS::ClusterCapacityProviderAssociations
    Properties:
      Cluster: !Ref Cluster
      CapacityProviders: [!Ref Capacity]
      DefaultCapacityProviderStrategy:
        - CapacityProvider: !Ref Capacity
          Weight: 1
  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /pataporte/dev/api
      RetentionInDays: 7
  MigrationLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /pataporte/dev/migrate
      RetentionInDays: 7
  ApiTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: pataporte-dev-api
      RequiresCompatibilities: [EC2]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !Ref ExecutionRoleArn
      TaskRoleArn: !If [CloudFeatures, !Ref ApplicationRoleArn, !Ref AWS::NoValue]
      ContainerDefinitions:
        - Name: api
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 8000
              Protocol: tcp
          Environment:
            - Name: ENVIRONMENT
              Value: production
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: STORAGE_BACKEND
              Value: !If [CloudFeatures, s3, local]
            - Name: ASSETS_BUCKET
              Value: !If [CloudFeatures, !ImportValue {'Fn::Sub': '${AsyncStackName}-AssetsBucketName'}, '']
            - Name: DATABASE_SSLMODE
              Value: verify-full
            - Name: DATABASE_SSLROOTCERT
              Value: /app/certs/us-east-1-bundle.pem
            - Name: DB_HOST
              Value:
                Fn::ImportValue: !Sub '${DataStackName}-DatabaseEndpoint'
            - Name: DB_PORT
              Value: '5432'
            - Name: DB_NAME
              Value:
                Fn::ImportValue: !Sub '${DataStackName}-DatabaseName'
            - Name: MAIL_FROM
              Value: noreply@example.invalid
            - Name: MAIL_HOST
              Value: not-configured.invalid
            - Name: RABBITMQ_HOST
              Value: not-configured.invalid
          Secrets:
            - Name: DB_USER
              ValueFrom: !Join ['', [!ImportValue {'Fn::Sub': '${BootstrapStackName}-AppDatabaseSecretArn'}, ':username::']]
            - Name: DB_PASSWORD
              ValueFrom: !Join ['', [!ImportValue {'Fn::Sub': '${BootstrapStackName}-AppDatabaseSecretArn'}, ':password::']]
            - Name: SECRET_KEY
              ValueFrom: !Join ['', [!ImportValue {'Fn::Sub': '${BootstrapStackName}-JwtSecretArn'}, ':jwt_secret::']]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApiLogs
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
  MigrationTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: pataporte-dev-migrate
      RequiresCompatibilities: [EC2]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !Ref ExecutionRoleArn
      ContainerDefinitions:
        - Name: migrate
          Image: !If [HasMigrationImage, !Ref MigrationImageUri, !Ref ImageUri]
          Essential: true
          Command: [python, -m, config.deploy_database]
          Environment:
            - Name: ENVIRONMENT
              Value: production
            - Name: DATABASE_SSLMODE
              Value: verify-full
            - Name: DATABASE_SSLROOTCERT
              Value: /app/certs/us-east-1-bundle.pem
            - Name: DB_HOST
              Value:
                Fn::ImportValue: !Sub '${DataStackName}-DatabaseEndpoint'
            - Name: DB_PORT
              Value: '5432'
            - Name: DB_NAME
              Value:
                Fn::ImportValue: !Sub '${DataStackName}-DatabaseName'
          Secrets:
            - Name: DB_USER
              ValueFrom: !Join ['', [!ImportValue {'Fn::Sub': '${DataStackName}-MasterSecretArn'}, ':username::']]
            - Name: DB_PASSWORD
              ValueFrom: !Join ['', [!ImportValue {'Fn::Sub': '${DataStackName}-MasterSecretArn'}, ':password::']]
            - Name: APP_DB_USER
              ValueFrom: !Join ['', [!ImportValue {'Fn::Sub': '${BootstrapStackName}-AppDatabaseSecretArn'}, ':username::']]
            - Name: APP_DB_PASSWORD
              ValueFrom: !Join ['', [!ImportValue {'Fn::Sub': '${BootstrapStackName}-AppDatabaseSecretArn'}, ':password::']]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref MigrationLogs
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
  DispatcherLogs:
    Type: AWS::Logs::LogGroup
    Condition: CloudFeatures
    Properties:
      LogGroupName: /pataporte/dev/dispatcher
      RetentionInDays: 7
  DispatcherTask:
    Type: AWS::ECS::TaskDefinition
    Condition: CloudFeatures
    Properties:
      Family: pataporte-dev-dispatcher
      RequiresCompatibilities: [EC2]
      NetworkMode: awsvpc
      Cpu: '64'
      Memory: '192'
      ExecutionRoleArn: !Ref ExecutionRoleArn
      TaskRoleArn: !Ref ApplicationRoleArn
      ContainerDefinitions:
        - Name: dispatcher
          Image: !If [HasDispatcherImage, !Ref DispatcherImageUri, !Ref ImageUri]
          Essential: true
          Command: [python, -m, messaging.dispatcher]
          Environment:
            - {Name: ENVIRONMENT, Value: production}
            - {Name: AWS_REGION, Value: !Ref 'AWS::Region'}
            - {Name: DATABASE_SSLMODE, Value: verify-full}
            - {Name: DATABASE_SSLROOTCERT, Value: /app/certs/us-east-1-bundle.pem}
            - Name: DB_HOST
              Value:
                Fn::ImportValue: !Sub '${DataStackName}-DatabaseEndpoint'
            - {Name: DB_PORT, Value: '5432'}
            - Name: DB_NAME
              Value:
                Fn::ImportValue: !Sub '${DataStackName}-DatabaseName'
            - {Name: MESSAGE_TRANSPORT, Value: sqs}
            - Name: SQS_QUEUE_URL
              Value:
                Fn::ImportValue: !Sub '${AsyncStackName}-QueueUrl'
          Secrets:
            - Name: DB_USER
              ValueFrom: !Join ['', [!ImportValue {'Fn::Sub': '${BootstrapStackName}-AppDatabaseSecretArn'}, ':username::']]
            - Name: DB_PASSWORD
              ValueFrom: !Join ['', [!ImportValue {'Fn::Sub': '${BootstrapStackName}-AppDatabaseSecretArn'}, ':password::']]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref DispatcherLogs
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
  DispatcherService:
    Type: AWS::ECS::Service
    Condition: CloudFeatures
    DependsOn: ClusterCapacity
    Properties:
      ServiceName: pataporte-dev-dispatcher
      Cluster: !Ref Cluster
      TaskDefinition: !Ref DispatcherTask
      DesiredCount: !Ref DispatcherDesiredCount
      CapacityProviderStrategy: [{CapacityProvider: !Ref Capacity, Weight: 1}]
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - Fn::ImportValue: !Sub '${NetworkStackName}-WorkerSecurityGroupId'
          Subnets:
            - Fn::ImportValue: !Sub '${NetworkStackName}-AppSubnetAId'
            - Fn::ImportValue: !Sub '${NetworkStackName}-AppSubnetBId'
  HealthHttpIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Public health checks only; application routes return 404
      GroupId:
        Fn::ImportValue: !Sub '${NetworkStackName}-AlbSecurityGroupId'
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: 0.0.0.0/0
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: pataporte-dev-alb
      Type: application
      Scheme: internet-facing
      SecurityGroups:
        - Fn::ImportValue: !Sub '${NetworkStackName}-AlbSecurityGroupId'
      Subnets:
        - Fn::ImportValue: !Sub '${NetworkStackName}-PublicSubnetAId'
        - Fn::ImportValue: !Sub '${NetworkStackName}-PublicSubnetBId'
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId:
        Fn::ImportValue: !Sub '${NetworkStackName}-VpcId'
      Protocol: HTTP
      Port: 8000
      TargetType: ip
      HealthCheckPath: /health/ready
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '15'
  HealthListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '404'
            ContentType: text/plain
            MessageBody: Application deployment is not public yet
  HealthRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HealthListener
      Priority: 1
      Conditions:
        - Field: path-pattern
          Values: [/health/live, /health/ready]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup
  EdgeApiRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: PlainEdgeApi
    Properties:
      ListenerArn: !Ref HealthListener
      Priority: 10
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Pataporte-Origin
            Values:
              - !Sub
                - '{{resolve:secretsmanager:${SecretArn}:SecretString:token}}'
                - SecretArn:
                    Fn::ImportValue: !Sub '${AsyncStackName}-OriginSecretArn'
      Actions: [{Type: forward, TargetGroupArn: !Ref TargetGroup}]
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasTls
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTPS
      Port: 443
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{CertificateArn: !Ref AlbCertificateArn}]
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '404'
            ContentType: text/plain
            MessageBody: Route not enabled
  HttpsHealthRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: HasTls
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 1
      Conditions: [{Field: path-pattern, Values: [/health/live, /health/ready]}]
      Actions: [{Type: forward, TargetGroupArn: !Ref TargetGroup}]
  HttpsEdgeApiRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: SecureEdgeApi
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 10
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Pataporte-Origin
            Values:
              - !Sub
                - '{{resolve:secretsmanager:${SecretArn}:SecretString:token}}'
                - SecretArn:
                    Fn::ImportValue: !Sub '${AsyncStackName}-OriginSecretArn'
      Actions: [{Type: forward, TargetGroupArn: !Ref TargetGroup}]
  ApiService:
    Type: AWS::ECS::Service
    DependsOn: [HealthRule, ClusterCapacity]
    Properties:
      ServiceName: pataporte-dev-api
      Cluster: !Ref Cluster
      TaskDefinition: !Ref ApiTask
      DesiredCount: !Ref ApiDesiredCount
      CapacityProviderStrategy:
        - CapacityProvider: !Ref Capacity
          Weight: 1
      PlacementStrategies:
        - Type: spread
          Field: attribute:ecs.availability-zone
        - Type: spread
          Field: instanceId
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      HealthCheckGracePeriodSeconds: 60
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - Fn::ImportValue: !Sub '${NetworkStackName}-ApiSecurityGroupId'
          Subnets:
            - Fn::ImportValue: !Sub '${NetworkStackName}-AppSubnetAId'
            - Fn::ImportValue: !Sub '${NetworkStackName}-AppSubnetBId'
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 8000
          TargetGroupArn: !Ref TargetGroup
  ApiScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Condition: ApiScaling
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub 'service/${Cluster}/${ApiService.Name}'
      MinCapacity: 2
      MaxCapacity: 3
      RoleARN: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService'
  ApiCpuScaling:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Condition: ApiScaling
    Properties:
      PolicyName: pataporte-dev-api-cpu
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ApiScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 60
        ScaleOutCooldown: 60
        ScaleInCooldown: 180
        PredefinedMetricSpecification: {PredefinedMetricType: ECSServiceAverageCPUUtilization}
  UnhealthyTargetsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: API has an unhealthy target for two consecutive minutes.
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - {Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName}
        - {Name: TargetGroup, Value: !GetAtt TargetGroup.TargetGroupFullName}
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Repeated 5xx responses from API containers.
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - {Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName}
        - {Name: TargetGroup, Value: !GetAtt TargetGroup.TargetGroupFullName}
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  ApiMemoryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: API memory pressure; inspect sizing before increasing task count.
      Namespace: AWS/ECS
      MetricName: MemoryUtilization
      Dimensions:
        - {Name: ClusterName, Value: !Ref Cluster}
        - {Name: ServiceName, Value: !GetAtt ApiService.Name}
      Statistic: Average
      Period: 60
      EvaluationPeriods: 3
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
Outputs:
  ClusterName:
    Value: !Ref Cluster
  CapacityProviderName:
    Value: !Ref Capacity
  ServiceName:
    Value: !GetAtt ApiService.Name
  MigrationTaskDefinitionArn:
    Value: !Ref MigrationTask
  ApiTaskDefinitionArn:
    Value: !Ref ApiTask
  LoadBalancerDnsName:
    Value: !GetAtt LoadBalancer.DNSName
  TargetGroupArn:
    Value: !Ref TargetGroup
  AutoScalingGroupName:
    Value: !Ref Hosts
  LoadBalancerDnsNameExport:
    Value: !GetAtt LoadBalancer.DNSName
    Export: {Name: !Sub '${AWS::StackName}-LoadBalancerDnsName'}
  DispatcherServiceName:
    Condition: CloudFeatures
    Value: !GetAtt DispatcherService.Name
