AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Pataporte storage and messaging (persistent, near-zero idle cost): S3 buckets,
  ECR repository, SQS queue + DLQ, EventBridge bus and rules, audit Lambda,
  DynamoDB audit and worker dedup tables and the app secret.

# ponytail: tags are stack-level (see infra/deploy-stack.sh), propagated by CloudFormation.

Parameters:
  ProjectName:
    Type: String
    Default: pataporte
    Description: Prefix for export names

Resources:
  # --- S3 (names generated by CloudFormation: globally unique, no collisions) ---
  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # versioning: an overwritten or deleted upload stays recoverable for 7 days
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          # medical-history PDFs are only kept until the worker emails them (old versions 1 more day)
          - Id: expire-historiales
            Status: Enabled
            Prefix: historiales/
            ExpirationInDays: 7
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
          - Id: expire-noncurrent
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
            ExpiredObjectDeleteMarker: true

  # ponytail: unused since the frontend moved to ECS (Learner Lab denies CloudFront OAC and OAI).
  # Kept so the stack update does not drop exports; delete it together with its outputs later.
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # --- ECR ---
  ApiRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: pataporte-api
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules": [{"rulePriority": 1, "description": "keep last 10 images",
            "selection": {"tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 10},
            "action": {"type": "expire"}}]}

  FrontendRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: pataporte-frontend
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules": [{"rulePriority": 1, "description": "keep last 10 images",
            "selection": {"tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 10},
            "action": {"type": "expire"}}]}

  # --- SQS ---
  EventsDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: pataporte-eventos-dlq
      MessageRetentionPeriod: 1209600

  EventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: pataporte-eventos
      VisibilityTimeout: 120
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt EventsDlq.Arn
        maxReceiveCount: 5

  # --- EventBridge ---
  EventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: pataporte

  # every API event goes to the worker queue
  ApiToQueueRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: !Ref EventBus
      EventPattern:
        source: [pataporte.api]
      Targets:
        - Id: worker-queue
          Arn: !GetAtt EventsQueue.Arn

  EventsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref EventsQueue]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt EventsQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt ApiToQueueRule.Arn

  # --- Audit: PataporteEmitido -> Lambda -> DynamoDB ---
  AuditTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: pataporte-auditoria
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH

  # Worker idempotency: one item per processed event id (outbox id), expired by TTL.
  DeliveriesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: pataporte-entregas
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id_evento
          AttributeType: S
      KeySchema:
        - AttributeName: id_evento
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expira
        Enabled: true

  AuditLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/pataporte-audit
      RetentionInDays: 3

  AuditFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: pataporte-audit
      Runtime: python3.12
      Handler: index.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      Timeout: 10
      LoggingConfig:
        LogGroup: !Ref AuditLogGroup
      Environment:
        Variables:
          TABLE_NAME: !Ref AuditTable
      Code:
        ZipFile: |
          import json
          import os

          import boto3
          from botocore.exceptions import ClientError

          tabla = boto3.resource("dynamodb").Table(os.environ["TABLE_NAME"])


          def handler(event, context):
              # the EventBridge event id is the key: a redelivered event is written only once
              try:
                  tabla.put_item(
                      Item={
                          "pk": event["id"],
                          "detail_type": event["detail-type"],
                          "time": event["time"],
                          "detail": json.dumps(event["detail"]),
                      },
                      ConditionExpression="attribute_not_exists(pk)",
                  )
              except ClientError as e:
                  if e.response["Error"]["Code"] != "ConditionalCheckFailedException":
                      raise

  AuditRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: !Ref EventBus
      EventPattern:
        source: [pataporte.api]
        detail-type: [PataporteEmitido]
      Targets:
        - Id: audit-lambda
          Arn: !GetAtt AuditFunction.Arn

  AuditInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuditFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt AuditRule.Arn

  # --- App secret: SECRET_KEY generated, mail values updated by hand (see infra/README.md) ---
  # No fixed Name: a deleted secret keeps its name reserved for 7-30 days.
  AppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Pataporte app secrets (SECRET_KEY, MAIL_USERNAME, MAIL_PASSWORD, MAIL_FROM)
      GenerateSecretString:
        SecretStringTemplate: '{"MAIL_USERNAME": "CHANGE_ME", "MAIL_PASSWORD": "CHANGE_ME", "MAIL_FROM": "CHANGE_ME"}'
        GenerateStringKey: SECRET_KEY
        PasswordLength: 64
        ExcludePunctuation: true

  # Password of the least-privilege DB user (pataporte_app, DML only) used by the API and the worker.
  # The init task (master credentials) creates/updates the role with this password.
  AppDbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Pataporte runtime database user (pataporte_app) password
      GenerateSecretString:
        SecretStringTemplate: '{"username": "pataporte_app"}'
        GenerateStringKey: password
        PasswordLength: 40
        ExcludePunctuation: true

Outputs:
  UploadsBucketName:
    Value: !Ref UploadsBucket
    Export:
      Name: !Sub ${ProjectName}-UploadsBucketName
  UploadsBucketArn:
    Value: !GetAtt UploadsBucket.Arn
    Export:
      Name: !Sub ${ProjectName}-UploadsBucketArn
  FrontendBucketName:
    Value: !Ref FrontendBucket
    Export:
      Name: !Sub ${ProjectName}-FrontendBucketName
  FrontendBucketArn:
    Value: !GetAtt FrontendBucket.Arn
    Export:
      Name: !Sub ${ProjectName}-FrontendBucketArn
  FrontendBucketDomainName:
    Value: !GetAtt FrontendBucket.RegionalDomainName
    Export:
      Name: !Sub ${ProjectName}-FrontendBucketDomainName
  RepositoryUri:
    Value: !GetAtt ApiRepository.RepositoryUri
    Export:
      Name: !Sub ${ProjectName}-RepositoryUri
  FrontendRepositoryUri:
    Value: !GetAtt FrontendRepository.RepositoryUri
  QueueUrl:
    Value: !Ref EventsQueue
    Export:
      Name: !Sub ${ProjectName}-QueueUrl
  QueueName:
    Value: !GetAtt EventsQueue.QueueName
    Export:
      Name: !Sub ${ProjectName}-QueueName
  DlqName:
    Value: !GetAtt EventsDlq.QueueName
    Export:
      Name: !Sub ${ProjectName}-DlqName
  EventBusName:
    Value: !Ref EventBus
    Export:
      Name: !Sub ${ProjectName}-EventBusName
  AuditTableName:
    Value: !Ref AuditTable
    Export:
      Name: !Sub ${ProjectName}-AuditTableName
  DeliveriesTableName:
    Value: !Ref DeliveriesTable
    Export:
      Name: !Sub ${ProjectName}-DeliveriesTableName
  AppDbSecretArn:
    Value: !Ref AppDbSecret
    Export:
      Name: !Sub ${ProjectName}-AppDbSecretArn
  AppSecretArn:
    Value: !Ref AppSecret
    Export:
      Name: !Sub ${ProjectName}-AppSecretArn
