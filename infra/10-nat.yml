AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Pataporte NAT (ephemeral, billed per hour). One NAT per AZ. Adds the default route to each private route table.

# ponytail: tags are stack-level (see infra/deploy-stack.sh), propagated by CloudFormation.

Parameters:
  ProjectName:
    Type: String
    Default: pataporte
    Description: Prefix of the network stack exports

Resources:
  NatEip1:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
  NatGateway1:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip1.AllocationId
      SubnetId:
        Fn::ImportValue: !Sub ${ProjectName}-PublicSubnet1

  NatEip2:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
  NatGateway2:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip2.AllocationId
      SubnetId:
        Fn::ImportValue: !Sub ${ProjectName}-PublicSubnet2

  PrivateDefaultRoute1:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId:
        Fn::ImportValue: !Sub ${ProjectName}-PrivateRouteTable1
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway1
  PrivateDefaultRoute2:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId:
        Fn::ImportValue: !Sub ${ProjectName}-PrivateRouteTable2
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway2

Outputs:
  NatGateway1:
    Value: !Ref NatGateway1
