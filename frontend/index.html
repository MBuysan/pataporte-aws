<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PATAPORTE</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./css/index.css" />
    <link rel="icon" href="assets/logo_pataporte_v2.png" type="image/png" />
  </head>

  <body>
    <!-- HERO (solo fondo) -->
    <section class="hero">
      <div class="hero-slide">
        <picture>
          <source media="(max-width: 600px)" srcset="assets/sin_titulo.png" />
          <img class="slide-1" src="assets/img_index.png" alt="Hero" />
        </picture>
        <div class="hero-overlay">
          <img
            src="assets/logo_pataporte.png"
            alt="Logo Pataporte"
            class="hero-logo"
          />
          <h1 class="hero-title">Pataporte</h1>
        </div>
      </div>
    </section>

    <!-- ACCESS -->
    <section class="access-section">
      <div class="tutor">
        <h2>Si tenés una mascota</h2>
        <p>Consultá vacunas, historial clínico y tratamientos.</p>

        <div class="buttons">
          <a href="pages/login.html" class="btn btn-light">Iniciar sesión</a>
          <a href="pages/registrar-tutor.html" class="btn btn-outline"
            >Registrarse</a
          >
        </div>
      </div>

      <div class="vet">
        <h2>Si sos una veterinaria</h2>
        <p>Gestioná consultas, vacunas y tratamientos de forma digital.</p>

        <div class="buttons">
          <a href="pages/login-veterinario.html" class="btn btn-dark"
            >Iniciar sesión</a
          >
          <a
            href="pages/registrar-organizacion.html"
            class="btn btn-outline-dark"
            >Registrarse</a
          >
        </div>
      </div>
    </section>

    <footer>
      <a href="#">Términos y condiciones</a>
      <a href="#">Política de privacidad</a>

      <div class="footer-right">
        <span>© PATAPORTE</span>
      </div>
    </footer>
  </body>
</html>
