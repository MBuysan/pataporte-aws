server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # archivos estáticos del frontend (HTML, CSS, JS)
    location / {
        try_files $uri $uri/ =404;
    }

    # solo para desarrollo local: en AWS CloudFront enruta /api/* al ALB
    location /api/ {
        proxy_pass http://backend:8000;  # sin URI: conserva el prefijo /api
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 6m;  # fotos de hasta 5MB
    }
}
