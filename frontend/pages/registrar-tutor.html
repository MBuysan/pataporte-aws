<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Tutor</title>
</head>
<body>

    <h2>Registro de Tutor</h2>

    <form id="formTutor">
        <label>Nombre:</label><br>
        <input type="text" id="nombre" required><br><br>

        <label>Cédula:</label><br>
        <input type="text" id="cedula" required inputmode="numeric" maxlength="9"><br><br>

        <label>Email:</label><br>
        <input type="email" id="email" required><br><br>

        <label>Contraseña:</label><br>
        <input type="password" id="password" required><br><br>

        <label>Teléfono:</label><br>
        <input type="text" id="telefono"><br><br>

        <button type="submit">Registrar</button>
    </form>

    <p id="mensaje"></p>

    <div style="margin-top: 15px;">
        <p>¿Ya tenés cuenta? <a href="login.html">Inicia sesión acá</a></p>
    </div>

    <div style="margin-top: 15px;">
        <p><a href="../index.html">← Volver al inicio</a></p>
    </div>
    <script src="../js/validacionesDocumentos.js"></script>
    <script src="../js/registrarTutor.js"></script>
</body>
</html>
