<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Esquema de vacunas</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 30px 16px;
    }

    .contenedor {
      max-width: 700px;
      margin: auto;
    }

    .volver {
      display: inline-block;
      margin-bottom: 16px;
      color: #4a90e2;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }

    .header {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .header h1 {
      font-size: 24px;
      margin-bottom: 6px;
      color: #222;
    }

    .header p {
      color: #777;
      font-size: 14px;
    }

    #mensaje {
      text-align: center;
      color: #888;
      margin: 20px 0;
    }

    .vacuna-card {
      background: white;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      border: 1px solid #ddd;
    }

    .vacuna-card.proxima {
      border: 2px solid #f57c00;
      background: #fff3e0;
    }

    .vacuna-titulo {
      font-size: 18px;
      font-weight: bold;
      color: #222;
      margin-bottom: 10px;
    }

    .vacuna-meta {
      font-size: 14px;
      color: #555;
      margin: 4px 0;
    }

    .alerta {
      margin-top: 10px;
      color: #e65100;
      font-weight: bold;
      font-size: 13px;
    }

  </style>
</head>

<body>

<div class="contenedor">

  <a id="btnVolver" class="volver" href="#">← Volver</a>

  <div class="header">
    <h1>Esquema de vacunas</h1>
  </div>

  <p id="mensaje"></p>

  <section id="resultado"></section>

</div>

<script src="../js/api.js"></script>
<script src="../js/esquemaVacunas.js"></script>

</body>
</html>
