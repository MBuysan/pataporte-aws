<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../css/verificar-pataporte.css" />
  <title>Verificar Pataporte</title>
  <link rel="icon" href="../assets/logo_pataporte_v2.png" type="image/png" />
</head>

<body>
<a href="../index.html"><img src="../assets/logo_pataporte_v2.png" alt="Pataporte" class="logo-pataporte-corner"></a>
<div class="contenedor">

  <a href="buscar-mascotas.html" class="volver">← Volver al buscador</a>

  <div class="encabezado">
    <h2>Verificar Pataporte</h2>
    <p>Ingresá el código que figura en el PDF del certificado para comprobar su validez.</p>
  </div>

  <!-- FORMULARIO -->
  <div class="form-verificar">
    <div class="campo">
      <label for="input-hash">Código de verificación</label>
      <div class="fila-input">
        <div>
          <input
            id="input-hash"
            type="text"
            placeholder="Pegá o escribí el código del PDF"
            autocomplete="off"
            spellcheck="false"
          />
          <p class="error-form" id="error-form"></p>
        </div>
        <button id="btn-verificar">Verificar</button>
      </div>
    </div>
  </div>

  <!-- RESULTADO -->
  <div id="resultado">
    <div id="cargando" class="cargando" style="display:none;">Verificando...</div>
    <div id="card-resultado" class="card-resultado" style="display:none;"></div>
  </div>

</div>

<script src="../js/api.js"></script>
<script src="../js/verificarPataporte.js"></script>
</body>
</html>
