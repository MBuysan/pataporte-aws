<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verificar Pataporte</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 30px 16px; }
    .contenedor { max-width: 650px; margin: auto; }

    /* ── Volver ── */
    .volver { color: #4a90e2; text-decoration: none; font-size: 14px; font-weight: bold; display: inline-block; margin-bottom: 20px; }

    /* ── Título ── */
    .titulo-pagina {
      background: white; padding: 20px 24px;
      border-radius: 12px; margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .titulo-pagina h2 { font-size: 20px; color: #222; margin-bottom: 4px; }
    .titulo-pagina p  { font-size: 13px; color: #888; }

    /* ── Formulario de búsqueda ── */
    .form-verificar {
      background: white; padding: 24px;
      border-radius: 12px; margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap;
    }
    .campo { flex: 1; min-width: 200px; }
    .campo label { font-size: 13px; color: #555; display: block; margin-bottom: 5px; font-weight: bold; }
    .campo input {
      width: 100%; padding: 10px 12px;
      border: 1px solid #ddd; border-radius: 8px;
      font-size: 14px; font-family: monospace; letter-spacing: 1px;
    }
    .campo input:focus { outline: none; border-color: #4a90e2; }

    button { border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; }
    .primary { background: #4a90e2; color: white; }
    .primary:hover { background: #357abd; }
    .primary:disabled { background: #b0c9ee; cursor: not-allowed; }

    .error-form { font-size: 13px; color: #c0392b; margin-top: 6px; min-height: 18px; }

    /* ── Estados de resultado ── */
    .cargando { color: #bbb; font-size: 14px; text-align: center; padding: 30px 0; }
    #resultado { display: none; }

    /* ── Tarjeta de resultado ── */
    .card-resultado {
      background: white; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    /* ── Badge de estado ── */
    .estado-banner {
      padding: 16px 24px;
      display: flex; align-items: center; gap: 12px;
    }
    .estado-banner.vigente    { background: #eafaf1; border-left: 4px solid #27ae60; }
    .estado-banner.deprecado  { background: #fef9e7; border-left: 4px solid #f39c12; }
    .estado-banner.revocado   { background: #fdedec; border-left: 4px solid #e74c3c; }

    .estado-icono { font-size: 28px; }
    .estado-texto h3 { font-size: 16px; font-weight: bold; }
    .estado-texto p  { font-size: 13px; margin-top: 2px; }
    .estado-banner.vigente   .estado-texto h3 { color: #1e8449; }
    .estado-banner.vigente   .estado-texto p  { color: #27ae60; }
    .estado-banner.deprecado .estado-texto h3 { color: #b7770d; }
    .estado-banner.deprecado .estado-texto p  { color: #f39c12; }
    .estado-banner.revocado  .estado-texto h3 { color: #922b21; }
    .estado-banner.revocado  .estado-texto p  { color: #e74c3c; }

    /* ── Cuerpo del resultado ── */
    .cuerpo { padding: 20px 24px; }

    .seccion-titulo {
      font-size: 11px; font-weight: bold; color: #aaa;
      text-transform: uppercase; letter-spacing: 0.6px;
      margin-bottom: 10px; margin-top: 20px;
    }
    .seccion-titulo:first-child { margin-top: 0; }

    .grilla { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .dato { }
    .dato .etiqueta { font-size: 11px; color: #aaa; margin-bottom: 2px; }
    .dato .valor    { font-size: 14px; color: #222; font-weight: bold; }

    /* ── Vacunas ── */
    .vacuna-card {
      border: 1px solid #eee; border-radius: 8px;
      padding: 12px 14px; margin-bottom: 8px;
    }
    .vacuna-nombre { font-size: 14px; font-weight: bold; color: #222; }
    .vacuna-estado {
      display: inline-block; margin-left: 8px;
      font-size: 10px; font-weight: bold; padding: 2px 7px;
      border-radius: 10px; vertical-align: middle;
    }
    .vacuna-estado.completo   { background: #eafaf1; color: #1e8449; }
    .vacuna-estado.incompleto { background: #fef9e7; color: #b7770d; }

    .dosis-lista { margin-top: 8px; }
    .dosis-item {
      font-size: 12px; color: #666;
      padding: 5px 0; border-top: 1px solid #f0f0f0;
      display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px;
    }
    .dosis-item:first-child { border-top: none; }
    .dosis-vet { font-size: 11px; color: #aaa; }

    /* ── Badge esquema completo general ── */
    .badge-general {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px; border-radius: 8px; font-size: 13px;
      font-weight: bold; margin-top: 16px;
    }
    .badge-general.completo   { background: #eafaf1; color: #1e8449; }
    .badge-general.incompleto { background: #fef9e7; color: #b7770d; }
  </style>
</head>

<body>
<div class="contenedor">

  <a href="buscar-mascotas.html" class="volver">← Volver al buscador</a>

  <div class="titulo-pagina">
    <h2>Verificar Pataporte</h2>
    <p>Ingresá el código que figura en el PDF del certificado para comprobar su validez.</p>
  </div>

  <!-- FORMULARIO -->
  <div class="form-verificar">
    <div class="campo">
      <label for="input-hash">Código de verificación</label>
      <input
        id="input-hash"
        type="text"
        placeholder="Pegá o escribí el código del PDF"
        autocomplete="off"
        spellcheck="false"
      />
      <p class="error-form" id="error-form"></p>
    </div>
    <button class="primary" id="btn-verificar">Verificar</button>
  </div>

  <!-- RESULTADO -->
  <div id="resultado">
    <div id="cargando" class="cargando" style="display:none;">Verificando...</div>
    <div id="card-resultado" class="card-resultado" style="display:none;"></div>
  </div>

</div>

<script src="../js/api.js"></script>
<script src="../js/verificarPataporte.js"></script>
</body>
</html>
