<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Perfil mascota — Veterinario</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 30px 16px; }

    .contenedor { max-width: 650px; margin: auto; }

    /* ── Header ── */
    .header {
      background: white; padding: 20px; border-radius: 12px;
      display: flex; gap: 15px; align-items: center;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .foto {
      width: 60px; height: 60px; border-radius: 50%;
      background: #dde8f8; color: #4a90e2;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: bold; flex-shrink: 0;
    }

    /* ── Botones de acción superiores ── */
    .acciones { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }

    button { border: none; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; }
    .primary { background: #4a90e2; color: white; }
    .primary:hover { background: #357abd; }
    .sec { background: #eee; color: #444; }
    .sec:hover { background: #e0e0e0; }
    .btn-peligro { background: #fce8e8; color: #c0392b; }
    .btn-peligro:hover { background: #f5c6c6; }

    /* ── Paneles inline (historial, tratamientos) ── */
    .panel { display: none; margin-bottom: 15px; }

    .card {
      background: white; padding: 14px 16px;
      border-radius: 10px; margin-bottom: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    }
    .card-titulo { font-size: 15px; font-weight: bold; color: #222; margin-bottom: 4px; }
    .card-meta   { font-size: 13px; color: #888; margin-top: 2px; }
    .card-desc   { font-size: 13px; color: #555; margin-top: 4px; }
    .card-freq   { font-size: 13px; color: #4a90e2; margin-top: 3px; }

    .fila {
      background: white; padding: 12px 16px;
      border-radius: 10px; margin-bottom: 8px;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      transition: box-shadow 0.15s;
    }
    .fila:hover { box-shadow: 0 3px 10px rgba(0,0,0,0.12); }

    /* ── Formulario de nuevo tratamiento (inline dentro del panel) ── */
    .form-inline {
      background: #f0f6ff; border: 1px solid #c8dcf5;
      border-radius: 10px; padding: 16px;
      margin-bottom: 12px; display: none;
    }
    .form-inline label { font-size: 13px; color: #555; display: block; margin-bottom: 3px; margin-top: 10px; }
    .form-inline label:first-child { margin-top: 0; }
    .form-inline input,
    .form-inline textarea {
      width: 100%; padding: 8px 10px; border: 1px solid #ccc;
      border-radius: 7px; font-size: 14px; margin: 0;
    }
    .form-inline textarea { resize: vertical; min-height: 60px; }
    .form-inline .form-acciones { display: flex; gap: 8px; margin-top: 12px; }
    .form-inline .form-acciones button { flex: 1; }
    .form-error { color: #c0392b; font-size: 13px; margin-top: 8px; min-height: 18px; }

    .sin-datos { color: #aaa; font-size: 14px; text-align: center; padding: 16px 0; }
    .cargando  { color: #aaa; font-size: 14px; text-align: center; padding: 16px 0; }
    .error-panel { color: #c0392b; font-size: 14px; padding: 12px 0; }

    /* ── Modal consulta ── */
    .modal-bg {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.5);
      align-items: center; justify-content: center; z-index: 100;
    }
    .modal-bg.activo { display: flex; }
    .modal {
      background: white; padding: 24px;
      border-radius: 12px; width: 420px; max-height: 90vh;
      overflow-y: auto; position: relative;
    }
    .modal h3 { margin-bottom: 16px; }
    .modal input, .modal textarea {
      width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 10px;
      border: 1px solid #ccc; border-radius: 7px;
    }
  </style>
</head>

<body>
<div class="contenedor">

  <!-- HEADER -->
  <div class="header">
    <div class="foto" id="foto">?</div>
    <div>
      <h3 id="nombre">Cargando...</h3>
      <small id="detalle" style="color:#888;"></small>
    </div>
  </div>

  <!-- ACCIONES -->
  <div class="acciones">
    <button class="primary" id="btn-consulta">+ Consulta</button>
    <button class="sec"     id="btn-historial">Historial</button>
    <button class="sec"     id="btn-tratamientos">Tratamientos</button>
  </div>

  <!-- PANEL HISTORIAL -->
  <div id="historial" class="panel"></div>

  <!-- PANEL TRATAMIENTOS -->
  <div id="panel-tratamientos" class="panel">

    <!-- Botón nuevo tratamiento (solo vet) -->
    <button class="primary" id="btn-nuevo-tratamiento" style="margin-bottom:12px; width:100%;">
      + Nuevo tratamiento
    </button>

    <!-- Formulario inline (oculto por defecto) -->
    <div class="form-inline" id="form-trat-container">
      <label>Nombre del tratamiento / medicamento *</label>
      <input type="text" id="trat-nombre" placeholder="Ej: Amoxicilina" />

      <label>Descripción</label>
      <textarea id="trat-descripcion" placeholder="Ej: Antibiótico para infección urinaria"></textarea>

      <label>Frecuencia</label>
      <input type="text" id="trat-frecuencia" placeholder="Ej: 1 comprimido de 250 mg cada 12 hs" />

      <label>Fecha de inicio</label>
      <input type="datetime-local" id="trat-inicio" />

      <label>Fecha de finalización (opcional)</label>
      <input type="datetime-local" id="trat-finalizacion" />

      <p class="form-error" id="trat-error"></p>

      <div class="form-acciones">
        <button type="button" class="primary"  id="btn-guardar-trat">Guardar</button>
        <button type="button" class="sec"      id="btn-cancelar-trat">Cancelar</button>
      </div>
    </div>

    <!-- Lista de tratamientos -->
    <div id="lista-tratamientos"></div>

  </div>

</div>

<!-- MODAL CONSULTA -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <button id="cerrar-modal" style="position:absolute;top:12px;right:14px;background:none;border:none;font-size:20px;cursor:pointer;">✕</button>
    <h3>Nueva consulta</h3>
    <form id="form">
      <label>Motivo</label>
      <input id="motivo" required />
      <label>Diagnóstico</label>
      <textarea id="diag"></textarea>
      <div id="vacunas"></div>
      <button type="submit" class="primary">Guardar consulta</button>
    </form>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/perfilMascotaVet.js"></script>
</body>
</html>
