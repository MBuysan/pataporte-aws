<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Perfil mascota — Veterinario</title>

  <link rel="stylesheet" href="../css/perfil-mascota-vet.css" />
  <link rel="icon" href="../assets/logo_pataporte_v2.png" type="image/png" />
  <style>.logo-pataporte-corner{position:fixed;top:14px;left:16px;height:40px;width:auto;z-index:999;}@media(min-width:950px){.logo-pataporte-corner{height:60px;width:auto;margin:10px;}}@media(max-width:768px){.logo-pataporte-corner{display:none;}}</style>
</head>

<body>

  <a href="../index.html"><img src="../assets/logo_pataporte_v2.png" alt="Pataporte" class="logo-pataporte-corner"></a>
  <div class="contenedor">

    <!-- TOPBAR -->

    <div class="topbar">

      <a href="buscar-mascotas.html" class="volver-link">
        ← Volver al buscador
      </a>

    </div>

    <!-- HEADER -->

    <div class="header">

      <div class="header-info">

        <div class="foto" id="foto">?</div>

        <div>

          <div class="nombre-mascota" id="nombre">Cargando...</div>

          <small id="detalle">
            Especie | Raza | Edad
          </small>

        </div>

      </div>

      <button class="primary" id="btn-certificado">
        Obtener certificado
      </button>

    </div>

    <!-- TRATAMIENTOS -->

    <div class="tratamientos-header">
      <p class="seccion-titulo">Tratamientos activos</p>
      <p id="mensaje-sin-tratamientos" class="sin-datos-inline"></p>
    </div>

    <div id="seccion-tratamientos"></div>

    <!-- ACCIONES -->

    <div class="acciones">

      <button class="primary" id="btn-consulta">
        + Consulta
      </button>

      <button class="primary" id="btn-nuevo-tratamiento">
        + Tratamiento
      </button>

      <button class="sec" id="btn-vacunas">
        Ver vacunas
      </button>

      <button class="sec" id="btn-historial">
        Ver historial
      </button>

    </div>

    <!-- PANEL HISTORIAL -->

    <div id="historial" class="panel"></div>

  </div>

  <!-- MODAL CONSULTA -->

  <div class="modal-bg" id="modal-consulta">

    <div class="modal">

      <button class="modal-cerrar" id="cerrar-modal-consulta">
        ✕
      </button>

      <h3>Nueva consulta</h3>

      <form id="form-consulta">

        <label>
          Motivo <span class="required">*</span>
        </label>

        <input id="motivo" required />

        <label>
          Diagnóstico <span class="required">*</span>
        </label>

        <textarea id="diag" required></textarea>

        <div id="vacunas"></div>

        <p class="modal-error" id="consulta-error"></p>

        <button type="submit" class="primary" style="margin-top:16px;width:100%;">
          Guardar consulta
        </button>

      </form>

    </div>

  </div>

  <!-- MODAL TRATAMIENTO -->

  <div class="modal-bg" id="modal-tratamiento">

    <div class="modal">

      <button class="modal-cerrar" id="cerrar-modal-tratamiento">
        ✕
      </button>

      <h3>Nuevo tratamiento</h3>

      <label>Nombre </label>

      <input type="text" id="trat-nombre" placeholder="Ej: Amoxicilina" />

      <label>Descripción </label>

      <textarea id="trat-descripcion" placeholder="Ej: Antibiótico para infección urinaria"></textarea>

      <label>Frecuencia </label>

      <input type="text" id="trat-frecuencia" placeholder="Ej: 1 comprimido de 250 mg cada 12 hs" />

      <div class="fechas-tratamiento">

        <div>
          <label>Fecha de inicio</label>
          <input type="date" id="trat-inicio" />
        </div>

        <div>
          <label class="label-opcional">
            Fecha de finalización
          </label>
          <input type="date" id="trat-finalizacion" />
        </div>

      </div>

      <p class="modal-error" id="trat-error"></p>

      <button type="button" class="primary" id="btn-guardar-trat" style="margin-top:16px;width:100%;">
        Guardar tratamiento
      </button>

    </div>

  </div>

  <!-- MODAL DETALLE CONSULTA -->

  <div class="modal-bg" id="modal-detalle-consulta">

    <div class="modal">

      <button class="modal-cerrar" id="cerrar-modal-detalle-consulta">
        ✕
      </button>

      <h3>Detalle de consulta</h3>

      <div id="contenido-detalle-consulta"></div>

    </div>

  </div>

  <script src="../js/api.js"></script>
  <script src="../js/perfilMascotaVet.js"></script>

</body>

</html>
