<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Registro Veterinaria - Pataporte</title>

    <link rel="stylesheet" href="../css/registrar-organizacion.css" />
    <link rel="icon" href="../assets/logo_pataporte_v2.png" type="image/png" />
  </head>

  <body>
    <main class="register-page">
      <section class="register-panel">
        <div class="register-box">
          <a href="../index.html" class="volver-link"> ← Volver </a>

          <h1 class="form-title">¡Regístrate!</h1>

          <p class="login-text">
            ¿Ya estas registrado?
            <a href="login-veterinario.html">Inicia sesión</a>
          </p>

          <p id="mensaje"></p>

          <form id="formOrganizacion">
            <div class="form-grid">
              <div class="form-group">
                <label for="nombre"> Nombre veterinario <span>*</span> </label>

                <input type="text" id="nombre" required />
              </div>

              <div class="form-group">
                <label for="matricula">
                  Matrícula veterinario <span>*</span>
                </label>

                <input type="text" id="matricula" required inputmode="numeric" maxlength="4" />
              </div>

              <div class="form-group">
                <label for="email"> Correo electrónico <span>*</span> </label>

                <input type="email" id="email" required />
              </div>

              <div class="form-group">
                <label for="rut_organizacion">
                  RUT Veterinaria <span>*</span>
                </label>

                <input
                  type="text"
                  id="rut_organizacion"
                  required
                  inputmode="numeric"
                  maxlength="12"
                />
              </div>

              <div class="form-group full-width">
                <label for="password">Contraseña <span>*</span></label>

                <div class="input-wrapper">
                  <input
                    type="password"
                    id="password"
                    required
                  />

                  <button
                    type="button"
                    id="togglePassword"
                    class="password-toggle"
                    aria-label="Mostrar contraseña"
                  >
                    <svg
                      id="eyeIcon"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                      <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                  </button>
                </div>
              </div>

            <!-- Indicadores de requisitos de contraseña -->
            <div id="indicadores-password">
              <p>La contraseña debe tener:</p>
              <ul>
                <li id="req-largo">Al menos 6 caracteres</li>
                <li id="req-mayuscula">Al menos una mayúscula</li>
                <li id="req-minuscula">Al menos una minúscula</li>
                <li id="req-numero">Al menos un número</li>
                <li id="req-especial">Al menos un carácter especial (!@#$%^&*?)</li>
              </ul>
            </div>

            <div class="bottom-row">
              <button type="submit">Registrar</button>

              <p class="required">* campos obligatorios</p>
            </div>

          </form>
        </div>
      </section>

      <section class="register-image"></section>
    </main>

    <script src="../js/validacionesDocumentos.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/registrarOrganizacion.js"></script>
  </body>
</html>
