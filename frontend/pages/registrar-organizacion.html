<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro Veterinaria - Pataporte</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/registrar-organizacion.css" />
    <link rel="icon" href="../assets/logo_pataporte_v2.png" type="image/png" />
  </head>
  <body>
    <div class="split-container">
      <!-- Panel Izquierdo (Formulario de Registro) -->
      <div class="form-panel">
        <div class="form-content">
          <a href="../index.html" class="back-link">← Volver</a>
          <!-- Cabecera -->
          <div class="form-header">
            <h1 class="form-title">¡Regístrate!</h1>
            <p class="form-subtitle">
              ¿Ya estas registrado?
              <a href="login-veterinario.html" class="form-link-action">Inicia sesión</a>
            </p>
          </div>

          <!-- Banner de Alerta / Mensajes (Alineado con registrarOrganizacion.js) -->
          <p id="mensaje"></p>

          <!-- Formulario -->
          <form id="formOrganizacion">
            <div class="form-grid">
              <div class="input-group">
                <label for="nombre" class="input-label">Nombre veterinario *</label>
                <div class="input-wrapper">
                  <input
                    type="text"
                    id="nombre"
                    class="input-field"
                    placeholder="Tu nombre completo"
                    required
                  />
                </div>
              </div>

              <div class="input-group">
                <label for="matricula" class="input-label">Matrícula veterinario *</label>
                <div class="input-wrapper">
                  <input
                    type="text"
                    id="matricula"
                    class="input-field"
                    inputmode="numeric"
                    maxlength="4"
                    placeholder="Ej: 1234"
                    required
                  />
                </div>
              </div>

              <div class="input-group">
                <label for="email" class="input-label">Correo electrónico *</label>
                <div class="input-wrapper">
                  <input
                    type="email"
                    id="email"
                    class="input-field"
                    placeholder="ejemplo@correo.com"
                    required
                  />
                </div>
              </div>

              <div class="input-group">
                <label for="rut_organizacion" class="input-label">RUT Veterinaria *</label>
                <div class="input-wrapper">
                  <input
                    type="text"
                    id="rut_organizacion"
                    class="input-field"
                    inputmode="numeric"
                    maxlength="12"
                    placeholder="Ej: 210123456789"
                    required
                  />
                </div>
              </div>

              <div class="input-group full-width">
                <label for="password" class="input-label">Contraseña *</label>
                <div class="input-wrapper">
                  <input
                    type="password"
                    id="password"
                    class="input-field"
                    placeholder="Creá tu contraseña"
                    required
                  />
                  <button
                    type="button"
                    id="togglePassword"
                    class="password-toggle"
                    aria-label="Mostrar contraseña"
                  >
                    <svg
                      id="eyeIcon"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path
                        d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
                      ></path>
                      <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                  </button>
                </div>
              </div>
            </div>

            <!-- Indicadores de requisitos de contraseña -->
            <div id="indicadores-password">
              <p>La contraseña debe tener:</p>
              <ul>
                <li id="req-largo">Al menos 6 caracteres</li>
                <li id="req-mayuscula">Al menos una mayúscula</li>
                <li id="req-minuscula">Al menos una minúscula</li>
                <li id="req-numero">Al menos un número</li>
                <li id="req-especial">Al menos un carácter especial (!@#$%^&*?)</li>
              </ul>
            </div>

            <div class="form-footer-legend">*campos obligatorios</div>

            <button type="submit" class="btn-submit">Registrar</button>
          </form>
        </div>
      </div>

      <!-- Panel Derecho (Imagen de fondo optimizada) -->
      <div class="visual-panel"></div>
    </div>

    <!-- Scripts funcionales del proyecto -->
    <script src="../js/validacionesDocumentos.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/registrarOrganizacion.js"></script>
  </body>
</html>
