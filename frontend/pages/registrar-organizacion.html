<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Organización / Veterinaria</title>
</head>
<body>

    <h2>Registro de Organización</h2>

    <form id="formOrganizacion">
        <label>RUT *:</label><br>
        <input type="text" id="rut" required inputmode="numeric" maxlength="12"><br><br>

        <label>Nombre de la Organización *:</label><br>
        <input type="text" id="nombre" required><br><br>

        <label>Email *:</label><br>
        <input type="email" id="email" required><br><br>

        <label>Contraseña *:</label><br>
        <input type="password" id="password" required><br><br>

        <button type="submit">Registrar Organización</button>
    </form>

    <p id="mensaje"></p>

    <div style="margin-top: 15px;">
        <p>¿Ya tenés cuenta? <a href="login-veterinaria.html">Inicia sesión acá</a></p>
    </div>

    <div style="margin-top: 15px;">
        <p><a href="../index.html">← Volver al inicio</a></p>
    </div>
    <script src="../js/validacionesDocumentos.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/registrarOrganizacion.js"></script>
</body>
</html>
