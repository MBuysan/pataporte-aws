<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Tratamientos - Pataporte</title>
  </head>
  <body>
    <h1>Gestión de tratamientos</h1>

    <a href="dashboard_veterinaria.html">Volver al dashboard</a>

    <h2>Crear tratamiento</h2>

    <form id="formTratamiento">
      <label>ID Mascota:</label><br />
      <input type="text" id="id_mascota" required /><br /><br />

      <label>Nombre:</label><br />
      <input type="text" id="nombre" required /><br /><br />

      <label>Descripción / indicaciones:</label><br />
      <textarea id="descripcion"></textarea><br /><br />

      <button type="submit">Crear tratamiento</button>
    </form>

    <p id="mensajeCrear"></p>

    <hr />

    <h2>Tratamientos activos</h2>

    <label>ID Mascota:</label><br />
    <input type="text" id="id_mascota_busqueda" />
    <button id="btnBuscarActivos" type="button">Buscar</button>

    <p id="mensajeLista"></p>
    <div id="listaTratamientos"></div>

    <script src="../js/api.js"></script>
    <script src="../js/tratamientos.js"></script>
  </body>
</html>
