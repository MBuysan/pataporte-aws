<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión - Pataporte</title>
  </head>
  <body>
    <h1>Iniciar sesión</h1>

    <form id="loginForm">
      <div>
        <label for="identificador">Email o Cédula</label>
        <input type="text" id="identificador" name="identificador" required />
      </div>

      <div>
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required />
      </div>

      <button type="submit">Iniciar sesión</button>
    </form>

    <p id="error" style="color: red"></p>

    <div style="margin-top: 10px">
      <a href="recuperar-password.html">Olvidé mi contraseña</a>
    </div>

    <div style="margin-top: 10px">
      <p>
        <a href="registrar-tutor.html">Registrate</a>
      </p>
    </div>

    <div style="margin-top: 20px">
      <a href="../index.html">← Volver al inicio</a>
    </div>
    <script src="../js/validacionesDocumentos.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
