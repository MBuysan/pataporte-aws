<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión - Pataporte</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/login.css" />
    <link rel="icon" href="../assets/logo_pataporte_v2.png" type="image/png" />
  </head>
  <body>
    <div class="split-container">
      <!-- Panel Izquierdo (Imagen de fondo optimizada) -->
      <div class="visual-panel"></div>

      <!-- Panel Derecho (Formulario de Login) -->
      <div class="form-panel">
        <div class="form-content">
          <a href="../index.html" class="back-link">← Volver</a>
          <!-- Cabecera -->
          <div class="form-header">
            <h1 class="form-title">Iniciar sesión</h1>
            <p class="form-subtitle">
              ¿Sos nuevo por acá?
              <a href="registrar-tutor.html" class="form-link-action"
                >Regístrate</a
              >
            </p>
          </div>

          <!-- Banner de Error (Alineado con app.js) -->
          <p id="error"></p>

          <!-- Formulario -->
          <form id="loginForm">
            <div class="input-group">
              <label for="identificador" class="input-label"
                >Email o Cédula</label
              >
              <div class="input-wrapper">
                <input
                  type="text"
                  id="identificador"
                  name="identificador"
                  class="input-field"
                  placeholder="Ingresá tu email o cédula"
                  required
                />
              </div>
            </div>

            <div class="input-group">
              <label for="password" class="input-label">Contraseña</label>
              <div class="input-wrapper">
                <input
                  type="password"
                  id="password"
                  name="password"
                  class="input-field"
                  placeholder="Ingresá tu contraseña"
                  required
                />
                <button
                  type="button"
                  id="togglePassword"
                  class="password-toggle"
                  aria-label="Mostrar contraseña"
                >
                  <svg
                    id="eyeIcon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
                    ></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
              </div>
            </div>

            <div class="forgot-password-wrapper">
              <a href="recuperar-password.html" class="forgot-password-link"
                >¿Olvidaste tu contraseña?</a
              >
            </div>

            <button type="submit" class="btn-submit">Iniciar sesión</button>
          </form>
        </div>
      </div>
    </div>

    <!-- Scripts funcionales del proyecto -->
    <script src="../js/validacionesDocumentos.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/app.js"></script>

  </body>
</html>
