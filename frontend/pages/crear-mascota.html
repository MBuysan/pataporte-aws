<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Registrar Mascota</title>
  </head>
  <body>
    <h2>Registrar Mascota</h2>

    <form id="formMascota">
      <label>Foto (jpeg/png/webp):</label><br />
      <input
        type="file"
        id="foto_archivo"
        accept="image/jpeg,image/png,image/webp"
      /><br /><br />

      <label>Nombre *:</label><br />
      <input
        type="text"
        id="nombre"
        placeholder="Ej: Fatiga"
        required
      /><br /><br />

      <label>Especie *:</label><br />
      <select id="especie" required>
        <option value="perro">Perro</option>
        <option value="gato">Gato</option>
        <option value="otro" selected>Otro</option>
      </select>
      <br /><br />

      <label>Raza (opcional):</label><br />
      <input
        type="text"
        id="raza"
        placeholder="Ej: Labrador, Siamés"
      /><br /><br />

      <label>Fecha de nacimiento (opcional):</label><br />
      <input type="date" id="fecha_de_nacimiento" /><br /><br />

      <label>Sexo *:</label><br />
      <select id="sexo" required>
        <option value="macho">Macho</option>
        <option value="hembra">Hembra</option>
        <option value="desconocido" selected>Desconocido</option></select
      ><br /><br />

      <button type="submit">Registrar</button>
      <button type="button" onclick="window.location.href='dashboard.html'" style="margin-left: 10px;">Cancelar</button>
    </form>

    <p id="mensaje"></p>
  <script src="../js/api.js"></script>
  <script src="../js/registrarMascota.js"></script>
  </body>
</html>
