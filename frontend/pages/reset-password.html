<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nueva contraseña — Pataporte</title>
    <style>

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .tarjeta {
        background: white;
        border-radius: 12px;
        padding: 40px;
        width: 100%;
        max-width: 440px;
        box-shadow: 0 2px 16px rgba(0, 0, 0, 0.1);
      }

      h2 {
        margin-bottom: 8px;
        color: #222;
      }

      .subtitulo {
        color: #666;
        font-size: 14px;
        margin-bottom: 28px;
      }

      .campo {
        margin-bottom: 20px;
      }

      label {
        display: block;
        font-size: 13px;
        font-weight: bold;
        color: #444;
        margin-bottom: 6px;
      }

      input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
        transition: border-color 0.2s;
      }

      input:focus {
        border-color: #4a90e2;
      }

      /* ── Campo del código — estilo especial ─────────────────────────────── 
         letter-spacing separa los caracteres para que se lea más fácil.
         text-align: center centra el texto en el campo.
         text-transform: uppercase muestra el texto en mayúsculas visualmente
         sin modificar el valor real — reset-password.js hace el .toUpperCase()
         real antes de enviar al servidor.                                 */
      #input-codigo {
        letter-spacing: 8px;
        font-size: 22px;
        font-weight: bold;
        text-align: center;
        text-transform: uppercase;
      }

      /* ── Indicadores de requisitos de contraseña ────────────────────────── 
         Se actualizan en tiempo real con reset-password.js cada vez que
         el usuario escribe en el campo de nueva contraseña.               */
      #indicadores-password {
        background: #f9f9f9;
        border: 1px solid #eee;
        border-radius: 8px;
        padding: 12px 16px;
        margin-bottom: 20px;
        font-size: 13px;
      }

      #indicadores-password p {
        font-weight: bold;
        color: #555;
        margin-bottom: 8px;
      }

      #indicadores-password ul {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      /* Estado inicial: gris neutro, sin indicar nada todavía */
      #indicadores-password li {
        color: #aaa;
      }

      #indicadores-password li::before {
        content: "○ ";  /* círculo vacío = sin evaluar todavía */
      }

      /* reset-password.js agrega clase "cumplido" cuando el requisito se cumple */
      #indicadores-password li.cumplido {
        color: #2d6a4f;
      }

      #indicadores-password li.cumplido::before {
        content: "✓ ";  /* tilde verde = cumplido */
      }

      /* reset-password.js agrega clase "pendiente" cuando el usuario ya escribió
         algo pero el requisito todavía no se cumple                       */
      #indicadores-password li.pendiente {
        color: #c0392b;
      }

      #indicadores-password li.pendiente::before {
        content: "✗ ";  /* cruz roja = pendiente */
      }

      button[type="submit"] {
        width: 100%;
        padding: 12px;
        background: #4a90e2;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s;
      }

      button[type="submit"]:hover {
        background: #357abd;
      }

      button[type="submit"]:disabled {
        background: #aaa;
        cursor: not-allowed;
      }

      .mensaje {
        display: none;
        padding: 12px;
        border-radius: 8px;
        margin-top: 16px;
        font-size: 14px;
      }

      .mensaje-exito {
        background: #e6f4ea;
        color: #2d6a4f;
      }

      .mensaje-error {
        background: #fce8e8;
        color: #c0392b;
      }

      .link-volver {
        display: block;
        text-align: center;
        margin-top: 24px;
        font-size: 13px;
        color: #4a90e2;
        text-decoration: none;
      }

      .link-volver:hover {
        text-decoration: underline;
      }

    </style>
  </head>

  <body>

    <div class="tarjeta">

      <h2>Nueva contraseña</h2>
      <p class="subtitulo">
        Ingresá el código que recibiste por email y tu nueva contraseña.
      </p>

      <!-- form-reset: reset-password.js escucha el evento "submit" de este form -->
      <form id="form-reset">

        <!-- Campo del código ──────────────────────────────────────────────── 
             maxlength="6" impide escribir más de 6 caracteres directamente
             desde el HTML, sin necesitar JavaScript para esto.
             autocomplete="off" evita que el navegador sugiera valores
             guardados — un código de recuperación nunca debe autocompletarse. -->
        <div class="campo">
          <label for="input-codigo">Código de recuperación</label>
          <input
            type="text"
            id="input-codigo"
            placeholder="A1B2C3"
            maxlength="6"
            autocomplete="off"
            required
          />
        </div>

        <!-- Campo nueva contraseña ────────────────────────────────────────── 
             type="password" oculta los caracteres mientras se escribe.
             autocomplete="new-password" le indica al navegador que este campo
             es para crear una contraseña nueva, no para autocompletar una
             existente — algunos gestores de contraseñas usan esta señal.  -->
        <div class="campo">
          <label for="input-nueva-password">Nueva contraseña</label>
          <input
            type="password"
            id="input-nueva-password"
            placeholder="Mínimo 6 caracteres"
            autocomplete="new-password"
            required
          />
        </div>

        <!-- Indicadores de requisitos ──────────────────────────────────────── 
             Cada <li> tiene un id único que reset-password.js usa para
             agregarle la clase "cumplido" o "pendiente" según corresponda.
             El CSS de arriba define cómo se ve cada clase.                -->
        <div id="indicadores-password">
          <p>La contraseña debe tener:</p>
          <ul>
            <li id="req-largo">Al menos 6 caracteres</li>
            <li id="req-mayuscula">Al menos una mayúscula</li>
            <li id="req-minuscula">Al menos una minúscula</li>
            <li id="req-numero">Al menos un número</li>
            <li id="req-especial">Al menos un carácter especial (!@#$%^&*?)</li>
          </ul>
        </div>

        <!-- Campo confirmar contraseña ─────────────────────────────────────── -->
        <div class="campo">
          <label for="input-confirmar-password">Confirmar contraseña</label>
          <input
            type="password"
            id="input-confirmar-password"
            placeholder="Repetí la contraseña"
            autocomplete="new-password"
            required
          />
        </div>

        <!-- id="btn-reset": reset-password.js lo deshabilita mientras espera -->
        <button type="submit" id="btn-reset">Guardar nueva contraseña</button>

      </form>

      <!-- Oculto por defecto — reset-password.js lo hace visible con feedback -->
      <div id="mensaje-reset" class="mensaje"></div>

      <a href="recuperar-password.html" class="link-volver">
        ← Pedir un nuevo código
      </a>

    </div>

    <!-- api.js primero: reset-password.js depende de la función api.post -->
    <script src="../js/api.js"></script>
    <script src="../js/resetPassword.js"></script>

  </body>
</html>
