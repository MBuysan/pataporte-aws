<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nueva contraseña — Pataporte</title>
    <link rel="stylesheet" href="../css/recuperar-password.css">
  </head>

  <body>

    <div class="tarjeta">

      <h2>Nueva contraseña</h2>
      <p class="subtitulo">
        Ingresá el código que recibiste por email y tu nueva contraseña.
      </p>

      <!-- form-reset: reset-password.js escucha el evento "submit" de este form -->
      <form id="form-reset">

        <!-- Campo del código ──────────────────────────────────────────────── 
             maxlength="6" impide escribir más de 6 caracteres directamente
             desde el HTML, sin necesitar JavaScript para esto.
             autocomplete="off" evita que el navegador sugiera valores
             guardados — un código de recuperación nunca debe autocompletarse. -->
        <div class="campo">
          <label for="input-codigo">Código de recuperación</label>
          <input
            type="text"
            id="input-codigo"
            placeholder="A1B2C3"
            maxlength="6"
            autocomplete="off"
            required
          />
        </div>

        <!-- Campo nueva contraseña ────────────────────────────────────────── 
             type="password" oculta los caracteres mientras se escribe.
             autocomplete="new-password" le indica al navegador que este campo
             es para crear una contraseña nueva, no para autocompletar una
             existente — algunos gestores de contraseñas usan esta señal.  -->
        <div class="campo">
          <label for="input-nueva-password">Nueva contraseña</label>
          <input
            type="password"
            id="input-nueva-password"
            placeholder="Mínimo 6 caracteres"
            autocomplete="new-password"
            required
          />
        </div>

        <!-- Indicadores de requisitos ──────────────────────────────────────── 
             Cada <li> tiene un id único que reset-password.js usa para
             agregarle la clase "cumplido" o "pendiente" según corresponda.
             El CSS de arriba define cómo se ve cada clase.                -->
        <div id="indicadores-password">
          <p>La contraseña debe tener:</p>
          <ul>
            <li id="req-largo">Al menos 6 caracteres</li>
            <li id="req-mayuscula">Al menos una mayúscula</li>
            <li id="req-minuscula">Al menos una minúscula</li>
            <li id="req-numero">Al menos un número</li>
            <li id="req-especial">Al menos un carácter especial (!@#$%^&*?)</li>
          </ul>
        </div>

        <!-- Campo confirmar contraseña ─────────────────────────────────────── -->
        <div class="campo">
          <label for="input-confirmar-password">Confirmar contraseña</label>
          <input
            type="password"
            id="input-confirmar-password"
            placeholder="Repetí la contraseña"
            autocomplete="new-password"
            required
          />
        </div>

        <!-- id="btn-reset": reset-password.js lo deshabilita mientras espera -->
        <button type="submit" id="btn-reset">Guardar nueva contraseña</button>

      </form>

      <!-- Oculto por defecto — reset-password.js lo hace visible con feedback -->
      <div id="mensaje-reset" class="mensaje"></div>

      <a href="recuperar-password.html" class="link-volver">
        ← Pedir un nuevo código
      </a>

    </div>

    <!-- api.js primero: reset-password.js depende de la función api.post -->
    <script src="../js/api.js"></script>
    <script src="../js/resetPassword.js"></script>

  </body>
</html>
