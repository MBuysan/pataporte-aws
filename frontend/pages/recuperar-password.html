<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar contraseña — Pataporte</title>
    <style>

      /* ── Reset ──────────────────────────────────────────────────────────────
         Elimina el margen y padding que los navegadores agregan por defecto
         a todos los elementos. Sin esto, cada navegador se ve diferente.
         box-sizing: border-box hace que el padding y border se incluyan
         dentro del ancho declarado, no se sumen por fuera.               */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      /* ── Fondo y centrado ───────────────────────────────────────────────────
         min-height: 100vh hace que el body ocupe al menos toda la altura
         de la pantalla aunque el contenido sea corto.
         display: flex + justify/align: center centran la tarjeta
         tanto horizontal como verticalmente.                              */
      body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      /* ── Tarjeta blanca contenedora ────────────────────────────────────────
         max-width limita el ancho en pantallas grandes.
         width: 100% hace que se achique en pantallas chicas.
         box-shadow agrega sombra: desplazamiento X, Y, difusión, color.  */
      .tarjeta {
        background: white;
        border-radius: 12px;
        padding: 40px;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 2px 16px rgba(0, 0, 0, 0.1);
      }

      h2 {
        margin-bottom: 8px;
        color: #222;
      }

      /* ── Subtítulo descriptivo ──────────────────────────────────────────── */
      .subtitulo {
        color: #666;
        font-size: 14px;
        margin-bottom: 28px;
      }

      /* ── Contenedor de cada campo (label + input) ───────────────────────── */
      .campo {
        margin-bottom: 20px;
      }

      /* ── Etiqueta del campo ─────────────────────────────────────────────── 
         display: block hace que ocupe su propia línea (por defecto es inline) */
      label {
        display: block;
        font-size: 13px;
        font-weight: bold;
        color: #444;
        margin-bottom: 6px;
      }

      /* ── Campo de texto ─────────────────────────────────────────────────── 
         width: 100% ocupa todo el ancho disponible dentro de .campo.
         outline: none elimina el borde azul por defecto del navegador
         al hacer foco — lo reemplazamos con nuestra propia versión abajo. */
      input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
        transition: border-color 0.2s;  /* anima el cambio de color del borde */
      }

      /* Estilo al hacer foco — reemplaza el outline por defecto del navegador */
      input:focus {
        border-color: #4a90e2;
      }

      /* ── Botón principal ────────────────────────────────────────────────── 
         cursor: pointer cambia el cursor a manito al pasar por encima.
         transition anima el cambio de color de fondo al hacer hover.     */
      button[type="submit"] {
        width: 100%;
        padding: 12px;
        background: #4a90e2;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s;
      }

      button[type="submit"]:hover {
        background: #357abd;
      }

      /* Estado deshabilitado — recuperar-password.js lo activa mientras espera */
      button[type="submit"]:disabled {
        background: #aaa;
        cursor: not-allowed;
      }

      /* ── Mensajes de feedback ───────────────────────────────────────────── 
         display: none los oculta por defecto.
         recuperar-password.js los hace visibles con .style.display = "block"
         y agrega la clase .mensaje-exito o .mensaje-error según corresponda. */
      .mensaje {
        display: none;
        padding: 12px;
        border-radius: 8px;
        margin-top: 16px;
        font-size: 14px;
      }

      .mensaje-exito {
        background: #e6f4ea;
        color: #2d6a4f;
      }

      .mensaje-error {
        background: #fce8e8;
        color: #c0392b;
      }

      /* ── Link de navegación ─────────────────────────────────────────────── */
      .link-volver {
        display: block;
        text-align: center;
        margin-top: 24px;
        font-size: 13px;
        color: #4a90e2;
        text-decoration: none;
      }

      .link-volver:hover {
        text-decoration: underline;
      }

    </style>
  </head>

  <body>

    <div class="tarjeta">

      <h2>¿Olvidaste tu contraseña?</h2>
      <p class="subtitulo">
        Ingresá tu email y te enviamos un código de recuperación.
      </p>

      <!-- form-recuperar: recuperar-password.js escucha el evento "submit" de este form -->
      <form id="form-recuperar">

        <div class="campo">
          <!-- el "for" del label debe coincidir con el "id" del input
               para que al hacer click en el label se enfoque el input  -->
          <label for="input-email">Email</label>
          <input
            type="email"
            id="input-email"
            placeholder="juan@email.com"
            autocomplete="email"
            required
          />
          <!-- type="email" hace que el navegador valide formato de email
               antes de disparar el evento submit (primera línea de defensa)
               required impide enviar el form si está vacío                -->
        </div>

        <!-- id="btn-enviar": recuperar-password.js lo deshabilita mientras espera -->
        <button type="submit" id="btn-enviar">Enviar código</button>

      </form>

      <!-- Oculto por defecto — recuperar-password.js lo hace visible con feedback -->
      <div id="mensaje-recuperar" class="mensaje"></div>

      <a href="index.html" class="link-volver">← Volver al inicio de sesión</a>

    </div>

    <!-- api.js primero: recuperar-password.js depende de la función api.post -->
    <script src="../js/api.js"></script>
    <script src="../js/recuperar-password.js"></script>

  </body>
</html>
