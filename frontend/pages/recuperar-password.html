<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar contraseña — Pataporte</title>
    <link rel="stylesheet" href="../css/recuperar-password.css">
    <link rel="icon" href="../assets/logo_pataporte_v2.png" type="image/png" />
  </head>

  <body>

  <img src="../assets/logo_pataporte_v2.png" alt="Pataporte" class="logo-pataporte-corner" id="logo-home">
    <div class="tarjeta">

      <h2>¿Olvidaste tu contraseña?</h2>
      <p class="subtitulo">
        Ingresá tu email y te enviamos un código de recuperación.
      </p>

      <!-- form-recuperar: recuperar-password.js escucha el evento "submit" de este form -->
      <form id="form-recuperar">

        <div class="campo">
          <!-- el "for" del label debe coincidir con el "id" del input
               para que al hacer click en el label se enfoque el input  -->
          <label for="input-email">Email</label>
          <input
            type="email"
            id="input-email"
            placeholder="juan@email.com"
            autocomplete="email"
            required
          />
          <!-- type="email" hace que el navegador valide formato de email
               antes de disparar el evento submit (primera línea de defensa)
               required impide enviar el form si está vacío                -->
        </div>

        <!-- id="btn-enviar": recuperar-password.js lo deshabilita mientras espera -->
        <button type="submit" id="btn-enviar">Enviar código</button>

      </form>

      <!-- Oculto por defecto — recuperar-password.js lo hace visible con feedback -->
      <div id="mensaje-recuperar" class="mensaje"></div>

      <a href="login.html" class="link-volver">← Volver al inicio de sesión</a>

    </div>

    <!-- api.js primero: recuperar-password.js depende de la función api.post -->
    <script src="../js/api.js"></script>
    <script src="../js/recuperarPassword.js"></script>

  </body>
</html>
