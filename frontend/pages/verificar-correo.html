<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verificación de cuenta — Pataporte</title>
  <link rel="stylesheet" href="../css/verificar-correo.css">
  <link rel="icon" href="../assets/logo_pataporte_v2.png" type="image/png" />
  <style>.logo-pataporte-corner{position:fixed;top:14px;left:16px;height:40px;width:auto;z-index:999;}@media(min-width:950px){.logo-pataporte-corner{height:60px;width:auto;margin:10px;}}@media(max-width:768px){.logo-pataporte-corner{display:none;}}</style>
</head>

<body>
  <a href="../index.html"><img src="../assets/logo_pataporte_v2.png" alt="Pataporte" class="logo-pataporte-corner"></a>
  <div class="tarjeta">
    <a href="javascript:history.back()" class="btn-volver">
      ← Volver
    </a>

    <h2>Verificá tu cuenta</h2>
    <p class="subtitulo">
      Ingresá el código de 6 dígitos que te enviamos por correo electrónico a <strong id="mostrar-email">...</strong>
      para activar tu cuenta.
    </p>

    <form id="form-verificacion">
      <div class="campo">
        <label for="input-codigo">Código de Verificación</label>
        <input type="text" id="input-codigo" placeholder="EJ: A1B2C3" maxlength="6" autocomplete="off" required />
      </div>

      <button type="submit" id="btn-verificar">Activar Cuenta</button>
    </form>

    <button type="button" id="btn-reenviar" class="btn-secundario">
      No me llegó el código, reenviar
    </button>

    <div id="mensaje-verificacion" class="mensaje"></div>
  </div>

  <!-- api.js para requests HTTP y luego el script controlador -->
  <script src="../js/api.js"></script>
  <script src="../js/verificarCorreo.js"></script>
</body>

</html>
