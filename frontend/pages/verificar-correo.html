<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verificación de cuenta — Pataporte</title>
    <style>
      /* Mismos estilos visuales consistentes que recuperar-password.html */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .tarjeta {
        background: white;
        border-radius: 12px;
        padding: 40px;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 2px 16px rgba(0, 0, 0, 0.1);
      }

      h2 {
        margin-bottom: 8px;
        color: #222;
      }

      .subtitulo {
        color: #666;
        font-size: 14px;
        margin-bottom: 28px;
        line-height: 1.4;
      }

      .campo {
        margin-bottom: 20px;
      }

      label {
        display: block;
        font-size: 13px;
        font-weight: bold;
        color: #444;
        margin-bottom: 6px;
      }

      input {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 18px;
        letter-spacing: 4px;
        font-weight: bold;
        text-align: center;
        outline: none;
        text-transform: uppercase;
        transition: border-color 0.2s;
      }

      input:focus {
        border-color: #4a90e2;
      }

      button[type="submit"] {
        width: 100%;
        padding: 12px;
        background: #4a90e2;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s;
      }

      button[type="submit"]:hover {
        background: #357abd;
      }

      button[type="submit"]:disabled {
        background: #aaa;
        cursor: not-allowed;
      }

      .btn-secundario {
        display: block;
        width: 100%;
        text-align: center;
        margin-top: 12px;
        font-size: 13px;
        color: #666;
        background: none;
        border: none;
        cursor: pointer;
        text-decoration: underline;
      }

      .btn-secundario:hover {
        color: #222;
      }

      .mensaje {
        display: none;
        padding: 12px;
        border-radius: 8px;
        margin-top: 16px;
        font-size: 14px;
        line-height: 1.4;
      }

      .mensaje-exito {
        background: #e6f4ea;
        color: #2d6a4f;
      }

      .mensaje-error {
        background: #fce8e8;
        color: #c0392b;
      }
    </style>
  </head>

  <body>
    <div class="tarjeta">
      <h2>Verificá tu cuenta</h2>
      <p class="subtitulo">
        Ingresá el código de 6 dígitos que te enviamos por correo electrónico a <strong id="mostrar-email">...</strong> para activar tu cuenta.
      </p>

      <form id="form-verificacion">
        <div class="campo">
          <label for="input-codigo">Código de Verificación</label>
          <input
            type="text"
            id="input-codigo"
            placeholder="EJ: A1B2C3"
            maxlength="6"
            autocomplete="off"
            required
          />
        </div>

        <button type="submit" id="btn-verificar">Activar Cuenta</button>
      </form>

      <button type="button" id="btn-reenviar" class="btn-secundario">
        No me llegó el código, reenviar
      </button>

      <div id="mensaje-verificacion" class="mensaje"></div>
    </div>

    <!-- api.js para requests HTTP y luego el script controlador -->
    <script src="../js/api.js"></script>
    <script src="../js/verificarCorreo.js"></script>
  </body>
</html>
