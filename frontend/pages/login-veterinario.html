<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión Veterinaria - Pataporte</title>

    <link rel="stylesheet" href="../css/login-veterinaria.css" />
    <link rel="icon" href="../assets/logo_pataporte_v2.png" type="image/png" />
  </head>

  <body>
    <main class="login-page">
      <section class="login-image"></section>

      <section class="login-panel">
        <div class="login-box">
          <a href="../index.html" class="volver-link"> ← Volver </a>
          <h1>Iniciar sesión</h1>

          <p class="register-text">
            ¿Sos nuevo por acá?
            <a href="registrar-organizacion.html" class="form-link-action"
              >Registrate</a
            >
          </p>

          <p id="error"></p>

          <form id="loginForm">
            <div class="form-group">
              <label for="identificador">Correo o matrícula</label>
              <input
              type="text"
              id="identificador"
              name="identificador"
              class="input-field"
              placeholder="Ingresá tu correo o matrícula"
              required
            />
            </div>

        <div class="form-group">
        <label for="password">Contraseña</label>

        <div class="input-wrapper">
          <input
            type="password"
            id="password"
            name="password"
            class="input-field"
            placeholder="Ingresá tu contraseña"
            required
          />

          <button
            type="button"
            id="togglePassword"
            class="password-toggle"
            aria-label="Mostrar contraseña"
          >
            <svg
              id="eyeIcon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

            <a class="forgot-link" href="recuperar-password.html">
              ¿Olvidaste tu contraseña?
            </a>

            <button type="submit">Iniciar sesión</button>
          </form>
        </div>
      </section>
    </main>

    <script src="../js/validacionesDocumentos.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/loginVeterinario.js"></script>
  </body>
</html>
