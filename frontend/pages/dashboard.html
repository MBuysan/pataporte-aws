<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel Tutor — Pataporte</title>
    <link rel="stylesheet" href="../css/dashboard.css?v=4" />
  </head>
  <body>
    <div class="contenedor">
      
      <div class="header-dashboard">
        <h2 id="saludo-usuario">Hola, Tutor</h2>
        <button id="btnLogout" class="btn-user-avatar" title="Cerrar sesión">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </button>
      </div>
      <p class="subtitulo">Bienvenido a Pataporte. Gestioná tus mascotas desde acá.</p>

      <div id="mensaje-dashboard" class="mensaje"></div>

      <div class="seccion-header">
        <p class="seccion-titulo">Mis mascotas</p>
        <a href="crear-mascota.html" class="btn-primario">Registrar mascota</a>
      </div>
      
      <div id="contenedor-mascotas">
        <p class="cargando">Cargando tus mascotas...</p>
      </div>

    </div>

    <script src="../js/api.js?v=2"></script>
    <script src="../js/dashboard.js?v=5"></script>
  </body>
</html>
