<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel Tutor — Pataporte</title>
    <link rel="stylesheet" href="../css/dashboard.css" />
  </head>

  <body>
    <div class="contenedor">

      <div class="header-dashboard">
        <h1 id="saludo-usuario">Hola, Tutor</h1>
        <button id="btnUserAvatar" class="btn-user-avatar" aria-label="Opciones de cuenta">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"></path>
          </svg>
        </button>
        
           <!-- Dropdown de cuenta (oculto por defecto) -->
        <div id="menuCuenta" class="menu-cuenta" style="display:none;">
          <button id="btnLogout" class="menu-cuenta-item">Cerrar sesión</button>
          <button id="btnEliminarCuenta" class="menu-cuenta-item menu-cuenta-item--danger">Eliminar cuenta</button>
        </div>
      </div>

      <p class="subtitulo">Bienvenido a Pataporte, gestioná tus mascotas desde acá.</p>

      <div id="mensaje-dashboard" class="mensaje"></div>

      <div class="seccion-header">
        <span class="seccion-titulo">Mis mascotas</span>
        <a href="crear-mascota.html" class="btn-primario">Registrar mascota</a>
      </div>

      <div id="contenedor-mascotas" class="cargando">Cargando...</div>

    </div>

 

    <script src="../js/api.js"></script>
    <script src="../js/dashboard.js"></script>
  </body>
</html>
