<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../css/buscar-mascotas.css" />
  <title>Buscar mascotas — Pataporte</title>
  <link rel="icon" href="../assets/logo_pataporte_v2.png" type="image/png" />
</head>

<body>
  <a href="buscar-mascotas.html"><img src="../assets/logo_pataporte_v2.png" alt="Pataporte" class="logo-pataporte-corner"></a>
  <div class="contenedor">
  <div class="header-dashboard">
    <h2>Buscar mascotas</h2>

    <div class="user-menu-wrapper">
      <button
        class="btn-user-avatar"
        id="btn-user-menu"
        aria-expanded="false"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </button>

      <div class="user-dropdown" id="user-dropdown">
        <button id="btn-logout" class="dropdown-item">
          Cerrar sesión
        </button>
      </div>
    </div>
  </div>
    <p class="subtitulo">Ingrese la cédula del tutor para ver sus mascotas.</p>

    <form id="form-busqueda">
      <div class="fila-busqueda">
        <input type="text" id="input-cedula" placeholder="Ej: 12345678" autocomplete="off" required />
        <button type="submit" id="btn-buscar">Buscar</button>
      </div>
    </form>

    <div id="mensaje-buscar" class="mensaje"></div>

    <!-- buscar-mascota.js llena este div con nombre del tutor y filas de mascotas -->
    <div id="resultado"></div>

  </div>

  <script src="../js/api.js"></script>
  <script src="../js/buscarMascotas.js"></script>
</body>

</html>
