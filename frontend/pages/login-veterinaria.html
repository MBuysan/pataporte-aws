<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión Veterinaria - Pataporte</title>
  </head>
  <body>
    <h1>Iniciar sesión - Veterinaria</h1>

    <form id="loginForm">
      <div>
        <label for="identificador">Email o RUT</label>
        <input type="text" id="identificador" name="identificador" required />
      </div>

      <div style="margin-top: 10px">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required />
      </div>

      <button type="submit" style="margin-top: 10px">Iniciar sesión</button>
    </form>

    <p id="error" style="color: red; margin-top: 10px"></p>

    <div style="margin-top: 10px">
      <p><a href="recuperar-password.html">Olvidé mi contraseña</a></p>
    </div>

    <div style="margin-top: 10px">
      <p>¿Tu clínica no está registrada? <a href="registrar-organizacion.html">Registrate aquí</a></p>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/loginVeterinaria.js"></script>
  </body>
</html>
