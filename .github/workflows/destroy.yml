name: destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "destroy" to confirm
        required: true
        type: string
      include_persistent:
        description: Also delete storage and network (buckets, ECR, queues, secret, audit table)
        type: boolean
        default: false
      delete_snapshots:
        description: Also delete every RDS snapshot of pataporte-db (next deploy starts with an empty database)
        type: boolean
        default: false

concurrency:
  group: pataporte-aws
  cancel-in-progress: false

jobs:
  destroy:
    if: inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Delete ephemeral stacks (edge, app, database, nat)
        run: |
          for stack in pataporte-edge pataporte-app pataporte-database pataporte-nat; do
            echo "deleting $stack"
            aws cloudformation delete-stack --stack-name "$stack"
            aws cloudformation wait stack-delete-complete --stack-name "$stack"
          done

      # The database stack leaves a final snapshot (DeletionPolicy: Snapshot); keep the 2 newest,
      # or none with delete_snapshots. include_persistent alone keeps them (data backup).
      - name: Prune RDS snapshots
        env:
          KEEP: ${{ inputs.delete_snapshots && '0' || '2' }}
        run: |
          snapshots=$(aws rds describe-db-snapshots --db-instance-identifier pataporte-db --snapshot-type manual \
            --query "reverse(sort_by(DBSnapshots, &SnapshotCreateTime))[].DBSnapshotIdentifier" --output text)
          i=0
          for snapshot in $snapshots; do
            i=$((i + 1))
            if [ "$i" -le "$KEEP" ]; then
              echo "keeping $snapshot" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "deleting $snapshot"
              aws rds delete-db-snapshot --db-snapshot-identifier "$snapshot" >/dev/null
            fi
          done

      # ECR images go with the repository (EmptyOnDelete: true); buckets must be emptied first,
      # including every object version and delete marker (the uploads bucket is versioned).
      - name: Delete persistent stacks (storage, network)
        if: inputs.include_persistent
        run: |
          out() { aws cloudformation describe-stacks --stack-name pataporte-storage --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text 2>/dev/null || true; }
          for key in UploadsBucketName FrontendBucketName; do
            bucket=$(out "$key")
            if [ -n "$bucket" ] && [ "$bucket" != "None" ]; then
              # ponytail: relists the whole bucket per batch of 1000 (O(n^2)); fine for a lab bucket
              while :; do
                batch=$(aws s3api list-object-versions --bucket "$bucket" --output json \
                  | jq -c '{Objects: [(.Versions // [])[], (.DeleteMarkers // [])[] | {Key, VersionId}][:1000], Quiet: true}')
                [ "$(jq '.Objects | length' <<<"$batch")" -gt 0 ] || break
                aws s3api delete-objects --bucket "$bucket" --delete "$batch" >/dev/null
              done
            fi
          done
          for stack in pataporte-storage pataporte-network; do
            echo "deleting $stack"
            aws cloudformation delete-stack --stack-name "$stack"
            aws cloudformation wait stack-delete-complete --stack-name "$stack"
          done

  rejected:
    if: inputs.confirm != 'destroy'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Confirmation must be exactly 'destroy'. Nothing was deleted."
          exit 1
