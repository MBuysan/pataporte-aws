name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Validar Python y CloudFormation
        run: |
          python -m compileall -q backend tests scripts
          python -m pip install cfn-lint==1.20.0
          cfn-lint infra/*.yaml
          python -m unittest discover -s scripts/tests -v
      - name: Preparar entorno local sin secretos externos
        run: |
          python scripts/init_local.py
          docker compose config --quiet
      - name: Construir e iniciar todos los servicios
        run: docker compose up -d --build
      - name: Comprobar empaquetado Lambda sin base de datos ni secretos de la API
        run: |
          docker build --platform linux/amd64 -f backend/Dockerfile.lambda -t pataporte-worker-check backend
          docker run --rm --platform linux/amd64 --entrypoint python pataporte-worker-check -c 'from messaging.lambda_handler import handler; from messaging.delivery import _generar_pdf; assert handler({"Records": []}, None) == {"batchItemFailures": []}'
      - name: Migraciones, TLS y recorrido funcional completo
        run: |
          docker compose exec -T -e PATAPORTE_RUN_MIGRATION_TESTS=1 backend python -m unittest discover -s tests -v
          python scripts/check_local.py
      - name: Conservar logs del ensayo
        if: always()
        run: |
          mkdir -p test-results
          docker compose ps > test-results/services.txt
          docker compose logs --no-color --tail=200 > test-results/compose.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: local-flow-logs
          path: test-results/
          retention-days: 7
      - name: Apagar solo el entorno efímero de CI
        if: always()
        run: docker compose down --volumes
