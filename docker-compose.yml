x-aws-local: &aws-local
  # LocalStack en vez de AWS. El alias localhost.localstack.cloud resuelve a LocalStack dentro de la red
  # y a 127.0.0.1 desde el navegador, así las URLs firmadas de S3 también abren desde el host.
  AWS_ENDPOINT_URL: http://localhost.localstack.cloud:4566
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_REGION: us-east-1
  UPLOADS_BUCKET: pataporte-uploads
  QUEUE_URL: http://localhost.localstack.cloud:4566/000000000000/pataporte-eventos
  EVENT_BUS_NAME: ""
  DEDUP_TABLE: pataporte-entregas
  # la URL se arma con DB_* apuntando al contenedor db (pisa un DATABASE_URL viejo del .env)
  DATABASE_URL: ""
  DB_HOST: db

services:
  localstack:
    image: localstack/localstack:3.8.1
    environment:
      SERVICES: s3,sqs,dynamodb
    ports:
      - "4566:4566"
    volumes:
      - ./localstack/init/ready.d:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD", "awslocal", "dynamodb", "describe-table", "--table-name", "pataporte-entregas"]
      interval: 5s
      retries: 20
    networks:
      default:
        aliases:
          - localhost.localstack.cloud

  init-db:
    build: ./backend
    command: python -m scripts.init_db
    env_file:
      - .env
    environment: *aws-local
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    # en desarrollo: recarga en caliente sobre el código montado
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment: *aws-local
    volumes:
      - ./backend:/app
    depends_on:
      init-db:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ./backend
    command: python -m messaging.consumer
    env_file:
      - .env
    environment: *aws-local
    volumes:
      - ./backend:/app
    depends_on:
      localstack:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db_data:
